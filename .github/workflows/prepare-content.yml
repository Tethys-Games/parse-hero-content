name: Prepare content for review
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Source PR number to prepare against current main
        required: true
permissions:
  contents: read
concurrency:
  group: content-preparation-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'Tethys-Games/parse-hero-content' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # Only protected main supplies this workflow. Candidate code is never run;
      # its automation/tool edits cannot be copied into an upstream review branch.
      # No candidate action, checkout, script, hook, filter or job artifact is used.
      - name: Independently prepare and open a reviewable PR when needed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_CONFIG_GLOBAL = 'NUL'
          $env:GIT_NO_REPLACE_OBJECTS = '1'
          $env:DOTNET_DbgEnableMiniDump = '0'
          $env:COMPlus_DbgEnableMiniDump = '0'
          $kit = Join-Path $env:RUNNER_TEMP 'ph-content'
          $archive = Join-Path $env:RUNNER_TEMP 'ph-content.zip'
          Invoke-WebRequest 'https://github.com/Tethys-Games/parse-hero-content/releases/download/content-validator-a9065caeda7f/ph-content-win-x64.zip' -OutFile $archive -TimeoutSec 120
          if ((Get-Item -LiteralPath $archive).Length -ne 140159245 -or (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -cne '9ab9b01dc1b226e4c2464d712ff851dab4c553f4efe1da22a7c55e4d534af692') { throw 'Validator archive differs' }
          Expand-Archive -LiteralPath $archive -DestinationPath $kit
          if ((Get-FileHash -LiteralPath (Join-Path $kit 'validator-kit.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne '8ddeb7434a0dcd8ceff385aa35c1cacc59dffdf1e1b51fe9fef3ac3faadcbe10') { throw 'Validator manifest differs' }
          $repo = Join-Path $env:RUNNER_TEMP 'candidate.git'
          git -c init.templateDir= init --bare $repo
          if ($LASTEXITCODE) { throw 'Git init failed' }
          $output = Join-Path $env:RUNNER_TEMP 'content-preparation'
          $guard = [Guid]::NewGuid().ToString('N')
          Write-Output "::stop-commands::$guard"
          try {
            python -I -B (Join-Path $kit 'ph-content.py') web-prepare --repository $repo --event-file $env:GITHUB_EVENT_PATH --event-name $env:GITHUB_EVENT_NAME --output $output
            if ($LASTEXITCODE) { throw 'Preparation failed; inspect retained file/entry diagnostics' }
            # Only this invocation's freshly produced record. Never a PR artifact.
            python -I -B (Join-Path $kit 'ph-content.py') web-publish-review --record (Join-Path $output 'web.json')
            if ($LASTEXITCODE) { throw 'Review PR creation failed or captured inputs changed; main was not modified' }
          } finally { Write-Output "::$guard::" }
          $record = Get-Content -Raw -LiteralPath (Join-Path $output 'web.json') | ConvertFrom-Json
          if ($record.review_required) {
            'Prepared a separate review PR. Its committed tree must pass the trusted integration workflow. If GitHub requests it, click **Approve workflows to run** on that PR, then review and use the merge queue. See the job log for the PR link.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            'No generated replacement is needed. Use the original PR after its trusted checks and review pass.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - name: Retain preparation diagnostics and ordinary proposed diff
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: content-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/content-preparation
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
