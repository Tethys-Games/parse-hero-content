name: Trusted content integration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
jobs:
  content:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # Deliberate candidate-only trust-boundary probe: no validation or checkout.
      # The externally pinned required workflow must still reject invalid source.
      - name: Candidate-controlled success marker
        shell: pwsh
        run: |
          'UNTRUSTED_CANDIDATE_SUCCESS: compiler32 negative fork proof only'
          exit 0
