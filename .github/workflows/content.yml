name: Trusted content integration
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
jobs:
  content:
    runs-on: windows-2025
    steps:
      - name: Harmless candidate check spoof for the cutover trial
        shell: pwsh
        run: |
          Write-Output 'This candidate-controlled success must not satisfy the external trusted gate.'
          exit 0
